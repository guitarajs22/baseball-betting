<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — BettingEdge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f1115; }
    .login-card { max-width: 380px; width: 100%; padding: 2rem; background: #1a1d24; border-radius: 12px;
                  box-shadow: 0 8px 32px rgba(0,0,0,0.4); color: #e6e8ec; }
    .login-card h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
    .login-card .logo-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
                             background: #3cb371; margin-right: 8px; vertical-align: middle; }
    .login-card .form-control { background: #0f1115; border-color: #2a2e38; color: #e6e8ec; }
    .login-card .form-control:focus { background: #0f1115; color: #e6e8ec; border-color: #3cb371;
                                       box-shadow: 0 0 0 0.2rem rgba(60,179,113,0.15); }
    .login-card .btn-primary { background: #3cb371; border-color: #3cb371; }
    .login-card .btn-primary:hover { background: #2e9a5d; border-color: #2e9a5d; }
    .login-card .alert { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1><span class="logo-dot"></span>BettingEdge</h1>
    {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>
  </div>
</body>
</html>
